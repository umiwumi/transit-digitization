<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yuzawa Snow Transit</title>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      line-height: 1.5;
    }
    .container { max-width: 680px; margin: 0 auto; }
    header { margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.25rem; font-weight: 700; color: var(--accent); }
    select, button {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }
    select:focus { border-color: var(--accent); }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    .control-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .time-col { display: flex; flex-direction: column; align-items: flex-start; }
    .time { font-size: 1.4rem; font-weight: 700; color: var(--accent); }
    .trip-badge { font-size: 0.75rem; color: var(--text-muted); }
    .info-col { display: flex; flex-direction: column; align-items: flex-end; text-align: right; }
    .stop-name { font-weight: 600; font-size: 1rem; }
    .details { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }
    .map-link { color: var(--accent); text-decoration: none; font-size: 0.8rem; margin-left: 8px; }
    .map-link:hover { text-decoration: underline; }
    .notice { text-align: center; color: var(--text-muted); padding: 24px; font-size: 0.95rem; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>❄️ Yuzawa Transit</h1>
    <select id="langSelect">
      <option value="en">English</option>
      <option value="jp">日本語</option>
      <option value="zh_tr">繁體中文</option>
      <option value="zh_si">简体中文</option>
      <option value="ko">한국어</option>
    </select>
  </header>

  <div class="controls">
    <div class="control-group">
      <label id="lblRoute">Route</label>
      <select id="routeSelect"></select>
    </div>
    <div class="control-group">
      <label id="lblDir">Direction</label>
      <select id="dirSelect"></select>
    </div>
  </div>

  <div id="scheduleContainer">
    <div class="notice">Loading timetables...</div>
  </div>
</div>

<script>
  const STOPS_FILE = 'Winter_Shuttle_Stops.csv';
  const SCHED_FILE = 'Winter_Shuttle_Schedules.csv';

  let stopsMap = {};
  let schedules = [];
  let currentLang = 'en';

  const langKeys = {
    en: 'Stop_Name_EN',
    jp: 'Stop_Name_JP',
    zh_tr: 'Stop_Name_ZH_TR',
    zh_si: 'Stop_Name_ZH_SI',
    ko: 'Stop_Name_KO'
  };

  async function loadData() {
    try {
      const [stopsRes, schedRes] = await Promise.all([
        fetch(STOPS_FILE).then(r => {
          if (!r.ok) throw new Error(`HTTP ${r.status}: Failed to fetch ${STOPS_FILE}`);
          return r.text();
        }),
        fetch(SCHED_FILE).then(r => {
          if (!r.ok) throw new Error(`HTTP ${r.status}: Failed to fetch ${SCHED_FILE}`);
          return r.text();
        })
      ]);

      Papa.parse(stopsRes, {
        header: true,
        skipEmptyLines: true,
        complete: (results) => {
          results.data.forEach(row => {
            if (row.Stop_ID) {
              stopsMap[row.Stop_ID.trim()] = row;
            }
          });
        }
      });

      Papa.parse(schedRes, {
        header: true,
        skipEmptyLines: true,
        complete: (results) => {
          schedules = results.data
            .filter(r => r.Route_Code && r.Departure_Time)
            .map(r => ({
              scheduleId: r.Schedule_ID ? r.Schedule_ID.trim() : '',
              routeCode: r.Route_Code.trim(),
              stopId: r.Stop_ID ? r.Stop_ID.trim() : '',
              tripNumber: r.Trip_Number ? r.Trip_Number.trim() : '',
              direction: r.Direction ? r.Direction.trim() : '',
              operatingDays: r.Operating_Days ? r.Operating_Days.trim() : 'Daily',
              departureTime: r.Departure_Time.trim()
            }));

          initUI();
        }
      });
    } catch (err) {
      document.getElementById('scheduleContainer').innerHTML =
        `<div class="notice" style="color: #f87171;">Error loading data: ${err.message}</div>`;
    }
  }

  function initUI() {
    const routeSelect = document.getElementById('routeSelect');
    const uniqueRoutes = [...new Set(schedules.map(s => s.routeCode))];

    routeSelect.innerHTML = '';
    uniqueRoutes.forEach(route => {
      const opt = document.createElement('option');
      opt.value = route;
      opt.textContent = route.replace(/_/g, ' ');
      routeSelect.appendChild(opt);
    });

    routeSelect.addEventListener('change', updateDirections);
    document.getElementById('dirSelect').addEventListener('change', renderTimetable);
    document.getElementById('langSelect').addEventListener('change', (e) => {
      currentLang = e.target.value;
      renderTimetable();
    });

    updateDirections();
  }

  function updateDirections() {
    const route = document.getElementById('routeSelect').value;
    const dirSelect = document.getElementById('dirSelect');
    const availableDirs = [...new Set(schedules.filter(s => s.routeCode === route).map(s => s.direction))];

    dirSelect.innerHTML = '';
    availableDirs.forEach(dir => {
      const opt = document.createElement('option');
      opt.value = dir;
      opt.textContent = dir.replace(/_/g, ' ');
      dirSelect.appendChild(opt);
    });

    renderTimetable();
  }

  function renderTimetable() {
    const route = document.getElementById('routeSelect').value;
    const dir = document.getElementById('dirSelect').value;
    const container = document.getElementById('scheduleContainer');

    const filtered = schedules
      .filter(s => s.routeCode === route && s.direction === dir)
      .sort((a, b) => {
        const [aH, aM] = a.departureTime.split(':').map(Number);
        const [bH, bM] = b.departureTime.split(':').map(Number);
        return (aH * 60 + aM) - (bH * 60 + bM);
      });

    if (filtered.length === 0) {
      container.innerHTML = '<div class="notice">No departures found for this selection.</div>';
      return;
    }

    container.innerHTML = filtered.map(item => {
      const stop = stopsMap[item.stopId] || {};
      const colKey = langKeys[currentLang] || 'Stop_Name_EN';
      const stopName = stop[colKey] || stop['Stop_Name_EN'] || item.stopId;
      const fareText = stop.Fare && parseInt(stop.Fare) > 0 ? `¥${stop.Fare}` : 'Free';
      const mapLink = stop.Google_Maps_URL ? `<a class="map-link" href="${stop.Google_Maps_URL}" target="_blank" rel="noopener">Map ↗</a>` : '';

      return `
        <div class="card">
          <div class="time-col">
            <span class="time">${item.departureTime}</span>
            <span class="trip-badge">Trip #${item.tripNumber} · ${item.operatingDays.replace(/_/g, ' ')}</span>
          </div>
          <div class="info-col">
            <div class="stop-name">${stopName}</div>
            <div class="details">${fareText} ${mapLink}</div>
          </div>
        </div>
      `;
    }).join('');
  }

  loadData();
</script>

</body>
</html>
