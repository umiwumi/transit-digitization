<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yuzawa Transit Guide</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        :root { --bg: #121212; --card: #1E1E1E; --text: #FFFFFF; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }
        .header { background: var(--card); padding: 16px; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #333; }
        .controls { display: flex; gap: 8px; margin-top: 12px; overflow-x: auto; padding-bottom: 4px; }
        select { background: #333; color: white; border: none; padding: 8px 12px; border-radius: 8px; font-size: 14px; }
        .stop-card { background: var(--card); margin: 12px; padding: 16px; border-radius: 12px; }
        .stop-name { font-size: 18px; font-weight: bold; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .map-btn { font-size: 14px; text-decoration: none; background: #333; padding: 4px 10px; border-radius: 12px; white-space: nowrap; }
        .departures { display: flex; gap: 8px; flex-wrap: wrap; }
        .time-badge { background: #333; padding: 6px 12px; border-radius: 6px; font-size: 14px; font-family: monospace; }
        #status-msg { text-align: center; padding: 30px; color: #888; font-family: monospace; font-size: 13px; line-height: 1.6; }
        h2 { margin: 0; font-size: 20px; }
    </style>
</head>
<body>

    <div class="header">
        <h2 id="appTitle">Yuzawa Transit Guide</h2>
        <div class="controls">
            <select id="langSelect" onchange="renderApp()">
                <option value="Stop_Name_EN">English</option>
                <option value="Stop_Name_JP">日本語</option>
                <option value="Stop_Name_ZH_TR">繁體中文</option>
                <option value="Stop_Name_ZH_SI">简体中文</option>
                <option value="Stop_Name_KO">한국어</option>
            </select>
            <select id="dirSelect" onchange="renderApp()">
                <option value="Outbound" id="optOutbound">To Seibu Crystal</option>
                <option value="Inbound" id="optInbound">To Yuzawa Sta.</option>
            </select>
            <select id="daySelect" onchange="renderApp()">
                <option value="Weekday" id="optWeekday">Weekday</option>
                <option value="Weekend/Holiday" id="optWeekend">Weekend / Holiday</option>
            </select>
        </div>
    </div>

    <div id="status-msg">Loading live timetable...</div>
    <div id="app"></div>

    <script>
        const STOPS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTP7TtdyoMDnpOOTF0rmnyHfB-bqH6gxTDHMTS7E8V5OxgTUFp4WAfC3nw2uvfluawrLWk7FpLUzG-K/pub?gid=1827150428&single=true&output=csv";
        const SCHEDULE_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTP7TtdyoMDnpOOTF0rmnyHfB-bqH6gxTDHMTS7E8V5OxgTUFp4WAfC3nw2uvfluawrLWk7FpLUzG-K/pub?gid=1754883098&single=true&output=csv";

        const uiDict = {
            'Stop_Name_EN': { title: "Yuzawa Transit Guide", out: "To Seibu Crystal", in: "To Yuzawa Sta.", wk: "Weekday", we: "Weekend / Holiday", empty: "No departures found.", farePrefix: "From Yuzawa: ¥" },
            'Stop_Name_JP': { title: "湯沢町バス時刻表", out: "西武クリスタル方面", in: "湯沢駅方面", wk: "平日", we: "土日祝", empty: "該当する運行はありません。", farePrefix: "湯沢駅より: ¥" },
            'Stop_Name_ZH_TR': { title: "湯澤町巴士時刻表", out: "往西武水晶", in: "往湯澤站", wk: "平日", we: "週末/假日", empty: "沒有符合的班次。", farePrefix: "從湯澤站出發: ¥" },
            'Stop_Name_ZH_SI': { title: "汤泽町巴士时刻表", out: "往西武水晶", in: "往汤泽站", wk: "平日", we: "周末/假日", empty: "没有符合的班次。", farePrefix: "从汤泽站出发: ¥" },
            'Stop_Name_KO': { title: "유자와 버스 시간표", out: "세이부 크리스탈 방면", in: "유자와역 방면", wk: "평일", we: "주말/공휴일", empty: "해당하는 운행이 없습니다.", farePrefix: "유자와역 출발: ¥" }
        };

        let stopsData = [];
        let scheduleData = [];

        function cleanHeaders(row) {
            const clean = {};
            for (let k in row) {
                if (row.hasOwnProperty(k) && k) {
                    const normalizedKey = k.trim();
                    clean[normalizedKey] = typeof row[k] === 'string' ? row[k].trim() : row[k];
                }
            }
            return clean;
        }

        function normalizeTime(t) {
            if (!t) return "";
            const parts = t.split(":");
            if (parts.length === 2) {
                const hour = parts[0].padStart(2, "0");
                const min = parts[1].padStart(2, "0");
                return `${hour}:${min}`;
            }
            return t;
        }

        Promise.all([
            new Promise((resolve, reject) => Papa.parse(STOPS_CSV_URL, { download: true, header: true, transformHeader: h => h.trim(), complete: resolve, error: reject })),
            new Promise((resolve, reject) => Papa.parse(SCHEDULE_CSV_URL, { download: true, header: true, transformHeader: h => h.trim(), complete: resolve, error: reject }))
        ]).then(results => {
            stopsData = (results[0].data || []).map(cleanHeaders).filter(row => Object.keys(row).some(k => k.toLowerCase().includes('stop_id') && row[k]));
            scheduleData = (results[1].data || []).map(cleanHeaders).filter(row => Object.keys(row).some(k => k.toLowerCase().includes('schedule_id') && row[k]));

            document.getElementById('status-msg').style.display = 'none';
            renderApp();
        }).catch(err => {
            document.getElementById('status-msg').innerText = "Failed to load CSV endpoints: " + err;
        });

        function getVal(obj, keyName) {
            if (!obj) return "";
            const match = Object.keys(obj).find(k => k.toLowerCase() === keyName.toLowerCase());
            return match ? (obj[match] || "").trim() : "";
        }

        function renderApp() {
            const lang = document.getElementById('langSelect').value;
            const direction = document.getElementById('dirSelect').value;
            const dayType = document.getElementById('daySelect').value;
            
            const dict = uiDict[lang] || uiDict['Stop_Name_EN'];
            document.getElementById('appTitle').innerText = dict.title;
            document.getElementById('optOutbound').innerText = dict.out;
            document.getElementById('optInbound').innerText = dict.in;
            document.getElementById('optWeekday').innerText = dict.wk;
            document.getElementById('optWeekend').innerText = dict.we;

            const appDiv = document.getElementById('app');
            appDiv.innerHTML = "";

            let displayStops = [...stopsData];
            if (direction.toLowerCase() === "inbound") displayStops.reverse();

            displayStops.forEach(stop => {
                const currentStopId = getVal(stop, 'Stop_ID');
                
                let departures = scheduleData.filter(s => {
                    const sStopId = getVal(s, 'Stop_ID');
                    const sDir = getVal(s, 'Direction');
                    const sDays = getVal(s, 'Operating_Days');
                    
                    return sStopId.toLowerCase() === currentStopId.toLowerCase() &&
                           sDir.toLowerCase() === direction.toLowerCase() &&
                           sDays.toLowerCase() === dayType.toLowerCase();
                });

                departures.sort((a, b) => {
                    const timeA = normalizeTime(getVal(a, 'Departure_Time'));
                    const timeB = normalizeTime(getVal(b, 'Departure_Time'));
                    return timeA.localeCompare(timeB);
                });

                if (departures.length > 0) {
                    const card = document.createElement('div');
                    card.className = 'stop-card';
                    
                    const stopNameContainer = document.createElement('div');
                    stopNameContainer.className = 'stop-name';
                    
                    let nameText = getVal(stop, lang) || getVal(stop, 'Stop_Name_EN') || getVal(stop, 'Stop_Name_JP') || currentStopId;
                    let mapUrl = getVal(stop, 'Google_Maps_URL') || getVal(stop, 'Map_Link');
                    let fareVal = getVal(stop, 'Fare_Yuzawa');

                    let mapHtml = mapUrl ? `<a href="${mapUrl}" target="_blank" class="map-btn">📍 Map</a>` : '';
                    let fareHtml = fareVal ? `<span style="font-size: 13px; color: #aaa; margin-left: 8px; font-weight: normal;">(${dict.farePrefix}${fareVal})</span>` : '';
                    
                    stopNameContainer.innerHTML = `<span>${nameText} ${fareHtml}</span> ${mapHtml}`;
                    
                    const timeContainer = document.createElement('div');
                    timeContainer.className = 'departures';
                    
                    departures.forEach(dep => {
                        const t = normalizeTime(getVal(dep, 'Departure_Time'));
                        if (t) {
                            const badge = document.createElement('div');
                            badge.className = 'time-badge';
                            badge.innerText = t;
                            timeContainer.appendChild(badge);
                        }
                    });

                    card.appendChild(stopNameContainer);
                    card.appendChild(timeContainer);
                    appDiv.appendChild(card);
                }
            });

            if (appDiv.innerHTML === "") {
                appDiv.innerHTML = `<div style='padding:20px; text-align:center; color:#888;'>${dict.empty}</div>`;
            }
        }
    </script>
</body>
</html>
