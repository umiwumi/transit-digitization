<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yuzawa Transit Directory</title>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --fare-badge: #059669;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      line-height: 1.5;
    }
    .container { max-width: 680px; margin: 0 auto; position: relative; }
    header { margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.25rem; font-weight: 700; color: var(--accent); }
    select, button, input {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }
    select:focus, input:focus { border-color: var(--accent); }

    /* Universal Search Bar */
    .search-wrapper { position: relative; margin-bottom: 14px; }
    .search-input-box {
      width: 100%;
      padding: 10px 36px 10px 14px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.95rem;
    }
    .clear-search-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1rem;
      display: none;
      padding: 4px;
    }
    .search-dropdown {
      position: absolute;
      top: 105%;
      left: 0;
      right: 0;
      background: #1e293b;
      border: 1px solid var(--accent);
      border-radius: 10px;
      max-height: 280px;
      overflow-y: auto;
      z-index: 100;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
      display: none;
    }
    .search-item {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .search-item:last-child { border-bottom: none; }
    .search-item:hover { background: #334155; }
    .search-item-main { font-weight: 600; font-size: 0.95rem; }
    .search-item-sub { font-size: 0.75rem; color: var(--text-muted); }
    .search-badge {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: #334155;
      color: var(--accent);
      margin-left: 8px;
    }
    
    /* Mode Toggle */
    .mode-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: var(--card-bg);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border);
      margin-bottom: 14px;
    }
    .mode-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      transition: background 0.2s, color 0.2s;
    }
    .mode-btn.active {
      background: var(--accent);
      color: #0f172a;
    }

    /* Filter Controls */
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .control-group { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }

    /* Timetable Cards */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .time-col { display: flex; flex-direction: column; align-items: flex-start; }
    .time { font-size: 1.35rem; font-weight: 700; color: var(--accent); }
    .trip-badge { font-size: 0.75rem; color: var(--text-muted); }
    .info-col { display: flex; flex-direction: column; align-items: flex-end; text-align: right; }
    .stop-name { font-weight: 600; font-size: 0.95rem; }
    .details { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; display: flex; align-items: center; gap: 6px; }
    .fare-tag {
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }
    .fare-tag.paid {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
    }
    .map-link { color: var(--accent); text-decoration: none; font-size: 0.8rem; }
    .map-link:hover { text-decoration: underline; }
    .notice { text-align: center; color: var(--text-muted); padding: 24px; font-size: 0.95rem; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1 id="appTitle">🚌 Yuzawa Transit</h1>
    <select id="langSelect">
      <option value="en">English</option>
      <option value="jp">日本語</option>
      <option value="zh_tr">繁體中文</option>
      <option value="zh_si">简体中文</option>
      <option value="ko">한국어</option>
    </select>
  </header>

  <!-- Multi-Language Search -->
  <div class="search-wrapper">
    <input type="text" id="searchInput" class="search-input-box" placeholder="🔍 Search stop or route..." autocomplete="off">
    <button id="clearSearch" class="clear-search-btn">✕</button>
    <div id="searchDropdown" class="search-dropdown"></div>
  </div>

  <!-- Mode Toggle -->
  <div class="mode-toggle">
    <button class="mode-btn active" id="btnWinter" onclick="switchMode('winter')">❄️ Winter Shuttles</button>
    <button class="mode-btn" id="btnPublic" onclick="switchMode('public')">🚍 Public Transit</button>
  </div>

  <!-- Filter Grid -->
  <div class="controls">
    <div class="control-group">
      <label id="lblRoute">Route</label>
      <select id="routeSelect"></select>
    </div>
    <div class="control-group">
      <label id="lblDir">Direction</label>
      <select id="dirSelect"></select>
    </div>
    <div class="control-group">
      <label id="lblDay">Schedule Type</label>
      <select id="daySelect"></select>
    </div>
    <div class="control-group">
      <label id="lblStop">Boarding Stop</label>
      <select id="stopSelect"></select>
    </div>
  </div>

  <!-- Timetable List -->
  <div id="scheduleContainer">
    <div class="notice">Loading timetables...</div>
  </div>
</div>

<script>
  // --- 1. GLOBAL STATE & CACHE (Strictly Isolated) ---
  const cache = {
    winter: { rawStops: [], schedules: [], stopsMap: {}, loaded: false },
    public: { rawStops: [], schedules: [], stopsMap: {}, loaded: false }
  };

  let currentLang = 'en';
  let currentMode = window.location.hash === '#public' ? 'public' : 'winter';

  const DATA_CONFIG = {
    winter: { stops: 'Winter_Shuttles_Stops.csv', schedules: 'Winter_Shuttles_Schedule.csv' },
    public: { stops: 'Public_Transit_Stops.csv', schedules: 'Public_Transit_Schedule.csv' }
  };

  const I18N = {
    ui: {
      title: { en: '🚌 Yuzawa Transit', jp: '🚌 湯沢町 交通案内', zh_tr: '🚌 湯澤交通指南', zh_si: '🚌 汤泽交通指南', ko: '🚌 유자와 교통 가이드' },
      winterBtn: { en: '❄️ Winter Shuttles', jp: '❄️ 冬季シャトルバス', zh_tr: '❄️ 冬季接駁車', zh_si: '❄️ 冬季接驳车', ko: '❄️ 겨울 셔틀버스' },
      publicBtn: { en: '🚍 Public Transit', jp: '🚍 路線バス', zh_tr: '🚍 路線公車', zh_si: '🚍 路线公交', ko: '🚍 일반 노선버스' },
      routeLabel: { en: 'Route', jp: '路線', zh_tr: '路線', zh_si: '路线', ko: '노선' },
      dirLabel: { en: 'Direction', jp: '方面 / 行き先', zh_tr: '方向', zh_si: '方向', ko: '방향' },
      dayLabel: { en: 'Schedule Type', jp: '運行区分', zh_tr: '運行類別', zh_si: '运行类别', ko: '운행 구분' },
      stopLabel: { en: 'Boarding Stop', jp: '乗車バス停', zh_tr: '乘車站牌', zh_si: '乘车站牌', ko: '탑승 정류장' },
      allDays: { en: 'All Operating Days', jp: 'すべての運行日', zh_tr: '所有運行日', zh_si: '所有运行日', ko: '모든 운행일' },
      allStops: { en: 'All Stops along Route', jp: '路線内のすべての停留所', zh_tr: '沿途所有站牌', zh_si: '沿途所有站牌', ko: '노선 내 모든 정류장' },
      free: { en: 'Free', jp: '無料', zh_tr: '免費', zh_si: '免费', ko: '무료' },
      terminal: { en: 'Terminal Station', jp: '発着拠点', zh_tr: '出發總站', zh_si: '始发总站', ko: '출발/도착역' },
      toFromStation: { en: '(to/from Sta.)', jp: '(駅発着運賃)', zh_tr: '(往返車站票價)', zh_si: '(往返车站票价)', ko: '(역 왕복 요금)' },
      trip: { en: 'Trip', jp: '便', zh_tr: '班次', zh_si: '班次', ko: '운행편' },
      map: { en: 'Map ↗', jp: '地図 ↗', zh_tr: '地圖 ↗', zh_si: '地图 ↗', ko: '지도 ↗' },
      loading: { en: 'Loading timetables...', jp: '時刻表を読み込み中...', zh_tr: '正在載入時刻表...', zh_si: '正在加载时刻表...', ko: '시간표를 불러오는 중...' },
      noDepartures: { en: 'No departures found for this selection.', jp: '該当する運行便がありません。', zh_tr: '沒有找到符合條件的班次。', zh_si: '没有找到符合条件的班次。', ko: '해당 조건의 운행 정보가 없습니다.' },
      searchPlaceholder: {
        en: '🔍 Search stop or route (e.g. Iwappara, 清津峡, GALA)...',
        jp: '🔍 バス停・路線を検索 (例: 岩原, 清津峡, GALA)...',
        zh_tr: '🔍 搜尋站牌或路線 (例如: 岩原, 清津峽, GALA)...',
        zh_si: '🔍 搜索站牌或路线 (例如: 岩原, 清津峡, GALA)...',
        ko: '🔍 정류장 또는 노선 검색 (예: 이와하라, 키요츠쿄, GALA)...'
      }
    },
    days: {
      'DAILY': { en: 'Daily', jp: '毎日運行', zh_tr: '每日運行', zh_si: '每日运行', ko: '매일 운행' },
      'WEEKDAY': { en: 'Weekday', jp: '平日', zh_tr: '平日', zh_si: '平日', ko: '평일' },
      'WEEKEND/HOLIDAY': { en: 'Weekend / Holiday', jp: '土休日', zh_tr: '週末 / 假日', zh_si: '周末 / 节假日', ko: '주말 / 공휴일' },
      'WEEKEND_HOLIDAY': { en: 'Weekend / Holiday', jp: '土休日', zh_tr: '週末 / 假日', zh_si: '周末 / 节假日', ko: '주말 / 공휴일' }
    },
    routes: {
      'SEIBU_CRYSTAL': { en: 'Seibu Crystal Line', jp: '西武クリスタル線', zh_tr: '西武水晶線', zh_si: '西武水晶线', ko: '세이부 크리스탈선' },
      'KIYOTSU': { en: 'Kiyotsukyo Gorge Line', jp: '清津峡線', zh_tr: '清津峽線', zh_si: '清津峡线', ko: '키요츠쿄선' },
      'HAKKAISAN': { en: 'Hakkaisan Line', jp: '八海山線', zh_tr: '八海山線', zh_si: '八海山线', ko: '핫카이산선' },
      'TOKAMACHIAEON': { en: 'Tokamachi / Aeon Line', jp: '十日町・イオン線', zh_tr: '十日町・永旺線', zh_si: '十日町・永旺线', ko: '토카마치・이온선' },
      'MAIKO': { en: 'Maiko / Muikamachi Line', jp: '舞子・六日町線', zh_tr: '舞子・六日町線', zh_si: '舞子・六日町线', ko: '마이코・무이카마치선' },
      'DAIGENTA': { en: 'Daigenta Canyon Line', jp: '大源太線', zh_tr: '大源太峽谷線', zh_si: '大源太峡谷线', ko: '다이겐타선' },
      'GALA_SPRING': { en: 'GALA Spring Shuttle', jp: 'GALA春便', zh_tr: 'GALA春季專車', zh_si: 'GALA春季专车', ko: 'GALA 봄 셔틀' }
    },
    directions: {
      'OUTBOUND': { en: 'Outbound (From Station)', jp: '下り（越後湯沢駅発）', zh_tr: '去程（越後湯澤站發車）', zh_si: '去程（越后汤泽站发车）', ko: '하행 (유자와역발)' },
      'INBOUND': { en: 'Inbound (To Station)', jp: '上り（越後湯沢駅行）', zh_tr: '回程（往越後湯澤站）', zh_si: '回程（往越后汤泽站）', ko: '상행 (유자와역행)' }
    }
  };

  const stopLangKeys = { en: 'Stop_Name_EN', jp: 'Stop_Name_JP', zh_tr: 'Stop_Name_ZH_TR', zh_si: 'Stop_Name_ZH_SI', ko: 'Stop_Name_KO' };

  // --- 2. CORE FUNCTIONS ---

  function normalizeKey(str) {
    return (str || '').trim().toUpperCase()
      .replace(/IWAHARA/g, 'IWAPPARA')
      .replace(/JOUKOKU/g, 'JOKOKU')
      .replace(/TOUKAMACHI/g, 'TOKAMACHI')
      .replace(/[\s/&・·,._~～—–+()（）[\]【】\-]+/g, '_')
      .replace(/^_+|_+$/g, '');
  }

  function translateRoute(rawRoute) {
    const key = normalizeKey(rawRoute);
    const entry = I18N.routes[key] || I18N.routes[rawRoute];
    return (entry && entry[currentLang]) ? entry[currentLang] : rawRoute.replace(/_/g, ' ');
  }

  function translateDirection(rawDir) {
    const key = normalizeKey(rawDir);
    const entry = I18N.directions[key] || I18N.directions[rawDir];
    return (entry && entry[currentLang]) ? entry[currentLang] : rawDir.replace(/_/g, ' ');
  }

  function translateDays(rawDays) {
    const key = normalizeKey(rawDays);
    const entry = I18N.days[key] || I18N.days[rawDays];
    return (entry && entry[currentLang]) ? entry[currentLang] : rawDays.replace(/_/g, ' ');
  }

  function updateStaticUI() {
    document.getElementById('appTitle').textContent = I18N.ui.title[currentLang] || I18N.ui.title.en;
    document.getElementById('btnWinter').textContent = I18N.ui.winterBtn[currentLang] || I18N.ui.winterBtn.en;
    document.getElementById('btnPublic').textContent = I18N.ui.publicBtn[currentLang] || I18N.ui.publicBtn.en;
    document.getElementById('lblRoute').textContent = I18N.ui.routeLabel[currentLang] || I18N.ui.routeLabel.en;
    document.getElementById('lblDir').textContent = I18N.ui.dirLabel[currentLang] || I18N.ui.dirLabel.en;
    document.getElementById('lblDay').textContent = I18N.ui.dayLabel[currentLang] || I18N.ui.dayLabel.en;
    document.getElementById('lblStop').textContent = I18N.ui.stopLabel[currentLang] || I18N.ui.stopLabel.en;
    document.getElementById('searchInput').placeholder = I18N.ui.searchPlaceholder[currentLang] || I18N.ui.searchPlaceholder.en;
  }

  function resolveStop(mode, routeCode, stopId) {
    const map = cache[mode].stopsMap;
    const rKey = normalizeKey(routeCode);
    const sId = (stopId || '').trim();
    return map[`${rKey}__${sId}`] || map[sId] || {};
  }

  function formatFareBadge(stop, stopNameJP) {
    const freeText = I18N.ui.free[currentLang] || I18N.ui.free.en;
    let fareVal = null;
    if (stop) {
      for (const key of Object.keys(stop)) {
        if (/^(fare|fare_yuzawa|price|cost|運賃)/i.test(key.trim())) {
          if (stop[key] !== undefined && stop[key] !== null && String(stop[key]).trim() !== '') {
            fareVal = String(stop[key]).trim();
            break;
          }
        }
      }
    }

    const digits = String(fareVal || '').replace(/[^\d.]/g, '');
    const num = parseFloat(digits);

    if (currentMode === 'winter') {
      if (!isNaN(num) && num > 0) return `<span class="fare-tag paid">¥${Math.round(num).toLocaleString()}</span>`;
      return `<span class="fare-tag">${freeText}</span>`;
    }

    // Public Transit check
    const isStation = /湯沢駅|六日町駅/i.test(stopNameJP || '');
    if (isStation || num === 0) {
      const termText = I18N.ui.terminal[currentLang] || 'Terminal';
      return `<span class="fare-tag" style="background: rgba(148, 163, 184, 0.15); color: var(--text-muted); font-weight: 500;">${termText}</span>`;
    }
    if (!isNaN(num) && num > 0) {
      const suffix = I18N.ui.toFromStation[currentLang] || '';
      return `<span class="fare-tag paid">¥${Math.round(num).toLocaleString()} <small style="font-size:0.72rem; opacity:0.85; font-weight:normal;">${suffix}</small></span>`;
    }
    return `<span class="fare-tag">${freeText}</span>`;
  }

  async function loadDataForMode(mode) {
    if (cache[mode].loaded) return;

    const stopsFile = DATA_CONFIG[mode].stops;
    const schedFile = DATA_CONFIG[mode].schedules;

    const [stopsRes, schedRes] = await Promise.all([
      fetch(stopsFile).then(r => r.ok ? r.text() : ""),
      fetch(schedFile).then(r => r.ok ? r.text() : "")
    ]);

    if (!stopsRes || !schedRes) throw new Error(`Could not load CSV files for ${mode} mode.`);

    Papa.parse(stopsRes, {
      header: true, skipEmptyLines: 'greedy',
      transformHeader: h => h.trim().replace(/^\ufeff/, ''),
      complete: (results) => {
        cache[mode].rawStops = results.data;
        results.data.forEach(row => {
          const sId = (row.Stop_ID || row.stop_id || '').trim();
          const rCode = normalizeKey(row.Route_Code || row.Route_ID || '');
          if (sId) {
            cache[mode].stopsMap[sId] = row;
            if (rCode) cache[mode].stopsMap[`${rCode}__${sId}`] = row;
          }
        });
      }
    });

    Papa.parse(schedRes, {
      header: true, skipEmptyLines: 'greedy',
      transformHeader: h => h.trim().replace(/^\ufeff/, ''),
      complete: (results) => {
        cache[mode].schedules = results.data
          .filter(r => (r.Route_Code || r.Route_ID) && r.Departure_Time)
          .map(r => ({
            scheduleId: (r.Schedule_ID || '').trim(),
            routeCode: (r.Route_Code || r.Route_ID || '').trim(),
            stopId: (r.Stop_ID || '').trim(),
            tripNumber: (r.Trip_Number || '').trim(),
            direction: (r.Direction || '').trim(),
            operatingDays: (r.Operating_Days || 'Daily').trim(),
            departureTime: (r.Departure_Time || '').trim()
          }));
      }
    });

    cache[mode].loaded = true;
  }

  // --- 3. UI STATE & FILTERING ---

  async function switchMode(mode) {
    currentMode = mode;
    window.location.hash = `#${mode}`;
    
    // Toggle Active Buttons
    document.getElementById('btnWinter').classList.toggle('active', mode === 'winter');
    document.getElementById('btnPublic').classList.toggle('active', mode === 'public');
    
    // Aggressive UI Flush to prevent mode bleeding
    document.getElementById('searchInput').value = '';
    document.getElementById('searchDropdown').style.display = 'none';
    document.getElementById('clearSearch').style.display = 'none';
    document.getElementById('routeSelect').innerHTML = '';
    document.getElementById('dirSelect').innerHTML = '';
    document.getElementById('daySelect').innerHTML = '';
    document.getElementById('stopSelect').innerHTML = '';

    document.getElementById('scheduleContainer').innerHTML = `<div class="notice">${I18N.ui.loading[currentLang] || I18N.ui.loading.en}</div>`;

    try {
      await loadDataForMode(mode);
      populateRoutes();
    } catch (err) {
      document.getElementById('scheduleContainer').innerHTML = `<div class="notice" style="color: #f87171;">Error: ${err.message}</div>`;
    }
  }

  function populateRoutes() {
    const routeSelect = document.getElementById('routeSelect');
    const uniqueRoutes = [...new Set(cache[currentMode].schedules.map(s => s.routeCode))];
    routeSelect.innerHTML = '';
    uniqueRoutes.forEach(route => {
      const opt = document.createElement('option');
      opt.value = route;
      opt.textContent = translateRoute(route);
      routeSelect.appendChild(opt);
    });
    routeSelect.onchange = populateDirections;
    populateDirections();
  }

  function populateDirections() {
    const route = document.getElementById('routeSelect').value;
    const dirSelect = document.getElementById('dirSelect');
    const availableDirs = [...new Set(cache[currentMode].schedules.filter(s => s.routeCode === route).map(s => s.direction))];
    dirSelect.innerHTML = '';
    availableDirs.forEach(dir => {
      const opt = document.createElement('option');
      opt.value = dir;
      opt.textContent = translateDirection(dir);
      dirSelect.appendChild(opt);
    });
    dirSelect.onchange = populateDaysAndStops;
    populateDaysAndStops();
  }

  function populateDaysAndStops() {
    const route = document.getElementById('routeSelect').value;
    const dir = document.getElementById('dirSelect').value;
    const daySelect = document.getElementById('daySelect');
    const stopSelect = document.getElementById('stopSelect');
    
    const routeSchedules = cache[currentMode].schedules.filter(s => s.routeCode === route && s.direction === dir);

    // Days
    const availableDays = [...new Set(routeSchedules.map(s => s.operatingDays))];
    daySelect.innerHTML = `<option value="ALL">${I18N.ui.allDays[currentLang] || I18N.ui.allDays.en}</option>`;
    availableDays.forEach(day => {
      const opt = document.createElement('option');
      opt.value = day;
      opt.textContent = translateDays(day);
      daySelect.appendChild(opt);
    });

    // Stops
    const routeStopIds = [...new Set(routeSchedules.map(s => s.stopId))];
    stopSelect.innerHTML = `<option value="ALL">${I18N.ui.allStops[currentLang] || I18N.ui.allStops.en}</option>`;
    routeStopIds.forEach(sId => {
      const stop = resolveStop(currentMode, route, sId);
      const colKey = stopLangKeys[currentLang] || 'Stop_Name_EN';
      const stopName = stop[colKey] || stop['Stop_Name_EN'] || sId;
      const opt = document.createElement('option');
      opt.value = sId;
      opt.textContent = stopName;
      stopSelect.appendChild(opt);
    });

    daySelect.onchange = renderTimetable;
    stopSelect.onchange = renderTimetable;
    renderTimetable();
  }

  function renderTimetable() {
    const route = document.getElementById('routeSelect').value;
    const dir = document.getElementById('dirSelect').value;
    const selectedDay = document.getElementById('daySelect').value;
    const selectedStop = document.getElementById('stopSelect').value;
    const container = document.getElementById('scheduleContainer');

    let filtered = cache[currentMode].schedules.filter(s => s.routeCode === route && s.direction === dir);
    if (selectedDay && selectedDay !== 'ALL') filtered = filtered.filter(s => s.operatingDays === selectedDay);
    if (selectedStop && selectedStop !== 'ALL') filtered = filtered.filter(s => s.stopId === selectedStop);

    filtered.sort((a, b) => {
      const [aH, aM] = a.departureTime.split(':').map(Number);
      const [bH, bM] = b.departureTime.split(':').map(Number);
      return (aH * 60 + aM) - (bH * 60 + bM);
    });

    if (filtered.length === 0) {
      container.innerHTML = `<div class="notice">${I18N.ui.noDepartures[currentLang] || I18N.ui.noDepartures.en}</div>`;
      return;
    }

    const tripWord = I18N.ui.trip[currentLang] || I18N.ui.trip.en;
    const mapWord = I18N.ui.map[currentLang] || I18N.ui.map.en;

    container.innerHTML = filtered.map(item => {
      const stop = resolveStop(currentMode, item.routeCode, item.stopId);
      const colKey = stopLangKeys[currentLang] || 'Stop_Name_EN';
      const stopName = stop[colKey] || stop['Stop_Name_EN'] || item.stopId;
      const fareBadge = formatFareBadge(stop, stop['Stop_Name_JP']);
      const mapUrl = stop.Google_Maps_URL;
      const mapLink = mapUrl ? `<a class="map-link" href="${mapUrl}" target="_blank" rel="noopener">${mapWord}</a>` : '';
      
      return `
        <div class="card">
          <div class="time-col">
            <span class="time">${item.departureTime}</span>
            <span class="trip-badge">${tripWord} #${item.tripNumber} · ${translateDays(item.operatingDays)}</span>
          </div>
          <div class="info-col">
            <div class="stop-name">${stopName}</div>
            <div class="details">${fareBadge} ${mapLink}</div>
          </div>
        </div>
      `;
    }).join('');
  }

  // --- 4. ISOLATED SEARCH ENGINE ---

  const searchInput = document.getElementById('searchInput');
  const searchDropdown = document.getElementById('searchDropdown');
  const clearSearchBtn = document.getElementById('clearSearch');

  searchInput.addEventListener('input', async (e) => {
    const rawQ = e.target.value.toLowerCase().trim();
    if (!rawQ) {
      searchDropdown.style.display = 'none';
      clearSearchBtn.style.display = 'none';
      return;
    }
    clearSearchBtn.style.display = 'block';

    await loadDataForMode(currentMode); // Ensure current mode data exists

    // Strictly restrict search to the currently active mode
    const activeStops = cache[currentMode].rawStops || [];
    
    const q = rawQ
      .replace(/iwahara/g, 'iwappara')
      .replace(/joukoku/g, 'jokoku')
      .replace(/toukamachi/g, 'tokamachi')
      .replace(/이와하라/g, '이와파라');

    const matches = activeStops.filter(stop => {
      const names = [stop.Stop_Name_EN, stop.Stop_Name_JP, stop.Stop_Name_ZH_TR, stop.Stop_Name_ZH_SI, stop.Stop_Name_KO].filter(Boolean);
      return names.some(n => n.toLowerCase().includes(q));
    });

    renderSearchResults(matches);
  });

  function renderSearchResults(matches) {
    if (matches.length === 0) {
      searchDropdown.innerHTML = `<div class="search-item"><div class="search-item-sub">No matching stops found in ${currentMode === 'winter' ? 'Winter Shuttles' : 'Public Transit'}.</div></div>`;
      searchDropdown.style.display = 'block';
      return;
    }

    // Deduplicate by Stop_ID to avoid rendering the same stop 10 times
    const uniqueMatches = [];
    const seenIds = new Set();
    matches.forEach(m => {
      if (!seenIds.has(m.Stop_ID)) {
        seenIds.add(m.Stop_ID);
        uniqueMatches.push(m);
      }
    });

    searchDropdown.innerHTML = uniqueMatches.slice(0, 15).map(stop => {
      const primaryName = stop[stopLangKeys[currentLang]] || stop.Stop_Name_EN;
      const routeName = translateRoute(stop.Route_Code || '');
      return `
        <div class="search-item" onclick="selectSearchMatch('${stop.Route_Code}', '${stop.Stop_ID}')">
          <div>
            <div class="search-item-main">${primaryName}</div>
            <div class="search-item-sub">${stop.Stop_Name_JP || ''}</div>
          </div>
          <div class="search-badge">${routeName}</div>
        </div>
      `;
    }).join('');
    searchDropdown.style.display = 'block';
  }

  window.selectSearchMatch = function(routeCode, stopId) {
    searchDropdown.style.display = 'none';
    searchInput.value = '';
    clearSearchBtn.style.display = 'none';

    document.getElementById('routeSelect').value = routeCode;
    populateDirections();
    document.getElementById('stopSelect').value = stopId;
    renderTimetable();
  };

  clearSearchBtn.addEventListener('click', () => {
    searchInput.value = '';
    searchDropdown.style.display = 'none';
    clearSearchBtn.style.display = 'none';
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-wrapper')) searchDropdown.style.display = 'none';
  });

  document.getElementById('langSelect').addEventListener('change', (e) => {
    currentLang = e.target.value;
    updateStaticUI();
    populateRoutes();
  });

  // --- 5. INITIALIZATION ---
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(err => console.error('SW Error:', err));
    });
  }

  updateStaticUI();
  switchMode(currentMode);

</script>
</body>
</html>
