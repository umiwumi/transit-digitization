<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yuzawa Transit Directory</title>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      line-height: 1.5;
    }
    .container { max-width: 680px; margin: 0 auto; }
    header { margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.25rem; font-weight: 700; color: var(--accent); }
    select, button {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }
    select:focus { border-color: var(--accent); }
    
    .mode-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: var(--card-bg);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .mode-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      transition: background 0.2s, color 0.2s;
    }
    .mode-btn.active {
      background: var(--accent);
      color: #0f172a;
    }

    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    .control-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .time-col { display: flex; flex-direction: column; align-items: flex-start; }
    .time { font-size: 1.4rem; font-weight: 700; color: var(--accent); }
    .trip-badge { font-size: 0.75rem; color: var(--text-muted); }
    .info-col { display: flex; flex-direction: column; align-items: flex-end; text-align: right; }
    .stop-name { font-weight: 600; font-size: 1rem; }
    .details { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }
    .map-link { color: var(--accent); text-decoration: none; font-size: 0.8rem; margin-left: 8px; }
    .map-link:hover { text-decoration: underline; }
    .notice { text-align: center; color: var(--text-muted); padding: 24px; font-size: 0.95rem; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🚌 Yuzawa Transit</h1>
    <select id="langSelect">
      <option value="en">English</option>
      <option value="jp">日本語</option>
      <option value="zh_tr">繁體中文</option>
      <option value="zh_si">简体中文</option>
      <option value="ko">한국어</option>
    </select>
  </header>

  <div class="mode-toggle">
    <button class="mode-btn active" id="btnWinter" onclick="switchMode('winter')">❄️ Winter Shuttles</button>
    <button class="mode-btn" id="btnPublic" onclick="switchMode('public')">🚍 Public Transit</button>
  </div>

  <div class="controls">
    <div class="control-group">
      <label id="lblRoute">Route</label>
      <select id="routeSelect"></select>
    </div>
    <div class="control-group">
      <label id="lblDir">Direction</label>
      <select id="dirSelect"></select>
    </div>
  </div>

  <div id="scheduleContainer">
    <div class="notice">Loading timetables...</div>
  </div>
</div>

<script>
  const DATA_CONFIG = {
    winter: {
      stops: 'Winter_Shuttle_Stops.csv',
      schedules: 'Winter_Shuttle_Schedules.csv'
    },
    public: {
      stops: 'Public_Transit_Stops.csv',
      schedules: 'Public_Transit_Schedules.csv'
    }
  };

  let currentMode = 'winter';
  let cache = {
    winter: { stopsMap: {}, schedules: [] },
    public: { stopsMap: {}, schedules: [] }
  };
  let currentLang = 'en';

  const langKeys = {
    en: 'Stop_Name_EN',
    jp: 'Stop_Name_JP',
    zh_tr: 'Stop_Name_ZH_TR',
    zh_si: 'Stop_Name_ZH_SI',
    ko: 'Stop_Name_KO'
  };

  async function loadDataForMode(mode) {
    if (cache[mode].schedules.length > 0) return;

    const stopsFile = DATA_CONFIG[mode].stops;
    const schedFile = DATA_CONFIG[mode].schedules;

    const [stopsRes, schedRes] = await Promise.all([
      fetch(stopsFile).then(r => {
        if (!r.ok) throw new Error(`Failed to load ${stopsFile}`);
        return r.text();
      }),
      fetch(schedFile).then(r => {
        if (!r.ok) throw new Error(`Failed to load ${schedFile}`);
        return r.text();
      })
    ]);

    Papa.parse(stopsRes, {
      header: true,
      skipEmptyLines: true,
      complete: (results) => {
        results.data.forEach(row => {
          if (row.Stop_ID) {
            cache[mode].stopsMap[row.Stop_ID.trim()] = row;
          }
        });
      }
    });

    Papa.parse(schedRes, {
      header: true,
      skipEmptyLines: true,
      complete: (results) => {
        cache[mode].schedules = results.data
          .filter(r => (r.Route_Code || r.Route_ID) && r.Departure_Time)
          .map(r => ({
            scheduleId: (r.Schedule_ID || '').trim(),
            routeCode: (r.Route_Code || r.Route_ID || '').trim(),
            stopId: (r.Stop_ID || '').trim(),
            tripNumber: (r.Trip_Number || '').trim(),
            direction: (r.Direction || '').trim(),
            operatingDays: (r.Operating_Days || 'Daily').trim(),
            departureTime: (r.Departure_Time || '').trim()
          }));
      }
    });
  }

  async function switchMode(mode) {
    currentMode = mode;
    document.getElementById('btnWinter').classList.toggle('active', mode === 'winter');
    document.getElementById('btnPublic').classList.toggle('active', mode === 'public');
    
    document.getElementById('scheduleContainer').innerHTML = '<div class="notice">Loading timetables...</div>';

    try {
      await loadDataForMode(mode);
      initUI();
    } catch (err) {
      document.getElementById('scheduleContainer').innerHTML =
        `<div class="notice" style="color: #f87171;">Error: ${err.message}</div>`;
    }
  }

  function initUI() {
    const activeSchedules = cache[currentMode].schedules;
    const routeSelect = document.getElementById('routeSelect');
    const uniqueRoutes = [...new Set(activeSchedules.map(s => s.routeCode))];

    routeSelect.innerHTML = '';
    uniqueRoutes.forEach(route => {
      const opt = document.createElement('option');
      opt.value = route;
      opt.textContent = route.replace(/_/g, ' ');
      routeSelect.appendChild(opt);
    });

    routeSelect.onchange = updateDirections;
    document.getElementById('dirSelect').onchange = renderTimetable;
    document.getElementById('langSelect').onchange = (e) => {
      currentLang = e.target.value;
      renderTimetable();
    };

    updateDirections();
  }

  function updateDirections() {
    const route = document.getElementById('routeSelect').value;
    const dirSelect = document.getElementById('dirSelect');
    const activeSchedules = cache[currentMode].schedules;
    const availableDirs = [...new Set(activeSchedules.filter(s => s.routeCode === route).map(s => s.direction))];

    dirSelect.innerHTML = '';
    availableDirs.forEach(dir => {
      const opt = document.createElement('option');
      opt.value = dir;
      opt.textContent = dir.replace(/_/g, ' ');
      dirSelect.appendChild(opt);
    });

    renderTimetable();
  }

  function renderTimetable() {
    const route = document.getElementById('routeSelect').value;
    const dir = document.getElementById('dirSelect').value;
    const container = document.getElementById('scheduleContainer');
    const activeStops = cache[currentMode].stopsMap;
    const activeSchedules = cache[currentMode].schedules;

    const filtered = activeSchedules
      .filter(s => s.routeCode === route && s.direction === dir)
      .sort((a, b) => {
        const [aH, aM] = a.departureTime.split(':').map(Number);
        const [bH, bM] = b.departureTime.split(':').map(Number);
        return (aH * 60 + aM) - (bH * 60 + bM);
      });

    if (filtered.length === 0) {
      container.innerHTML = '<div class="notice">No departures found for this selection.</div>';
      return;
    }

    container.innerHTML = filtered.map(item => {
      const stop = activeStops[item.stopId] || {};
      const colKey = langKeys[currentLang] || 'Stop_Name_EN';
      const stopName = stop[colKey] || stop['Stop_Name_EN'] || item.stopId;
      const fareVal = stop.Fare || stop.Fare_Yuzawa;
      const fareText = fareVal && parseInt(fareVal) > 0 ? `¥${fareVal}` : 'Free';
      const mapUrl = stop.Google_Maps_URL;
      const mapLink = mapUrl ? `<a class="map-link" href="${mapUrl}" target="_blank" rel="noopener">Map ↗</a>` : '';

      return `
        <div class="card">
          <div class="time-col">
            <span class="time">${item.departureTime}</span>
            <span class="trip-badge">Trip #${item.tripNumber} · ${item.operatingDays.replace(/_/g, ' ')}</span>
          </div>
          <div class="info-col">
            <div class="stop-name">${stopName}</div>
            <div class="details">${fareText} ${mapLink}</div>
          </div>
        </div>
      `;
    }).join('');
  }

  // Load winter shuttles by default on entry
  switchMode('winter');
</script>

</body>
</html>
