<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yuzawa Transit Directory</title>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --fare-badge: #059669;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      line-height: 1.5;
    }
    .container { max-width: 680px; margin: 0 auto; position: relative; }
    header { margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.25rem; font-weight: 700; color: var(--accent); }
    select, button, input {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }
    select:focus, input:focus { border-color: var(--accent); }

    /* Search Bar */
    .search-wrapper { position: relative; margin-bottom: 14px; }
    .search-input-box {
      width: 100%;
      padding: 10px 36px 10px 14px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.95rem;
    }
    .clear-search-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1rem;
      display: none;
      padding: 4px;
    }
    .search-dropdown {
      position: absolute;
      top: 105%;
      left: 0;
      right: 0;
      background: #1e293b;
      border: 1px solid var(--accent);
      border-radius: 10px;
      max-height: 280px;
      overflow-y: auto;
      z-index: 100;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
      display: none;
    }
    .search-item {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .search-item:last-child { border-bottom: none; }
    .search-item:hover { background: #334155; }
    .search-item-main { font-weight: 600; font-size: 0.95rem; }
    .search-item-sub { font-size: 0.75rem; color: var(--text-muted); }
    .search-badge {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: #334155;
      color: var(--accent);
      margin-left: 8px;
    }
    
    /* Mode Toggle */
    .mode-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: var(--card-bg);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border);
      margin-bottom: 14px;
    }
    .mode-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      transition: background 0.2s, color 0.2s;
    }
    .mode-btn.active {
      background: var(--accent);
      color: #0f172a;
    }

    /* Filter Grid */
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .control-group { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }

    /* Cards */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .time-col { display: flex; flex-direction: column; align-items: flex-start; }
    .time { font-size: 1.35rem; font-weight: 700; color: var(--accent); }
    .trip-badge { font-size: 0.75rem; color: var(--text-muted); }
    .info-col { display: flex; flex-direction: column; align-items: flex-end; text-align: right; }
    .stop-name { font-weight: 600; font-size: 0.95rem; }
    .details { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; display: flex; align-items: center; gap: 6px; }
    .fare-tag {
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }
    .fare-tag.paid {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
    }
    .map-link { color: var(--accent); text-decoration: none; font-size: 0.8rem; }
    .map-link:hover { text-decoration: underline; }
    .notice { text-align: center; color: var(--text-muted); padding: 24px; font-size: 0.95rem; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1 id="appTitle">🚌 Yuzawa Transit</h1>

    <button id="clearSearch" class="clear-search-btn">✕</button>
    <div id="searchDropdown" class="search-dropdown"></div>
  </div>

  <!-- Mode Toggle -->
  <div class="mode-toggle">
    <button class="mode-btn active" id="btnWinter" onclick="switchMode('winter')">❄️ Winter Shuttles</button>
    <button class="mode-btn" id="btnPublic" onclick="switchMode('public')">🚍 Public Transit</button>
  </div>

  <!-- Filter Controls -->
  <div class="controls">
    <div class="control-group">
      <label id="lblRoute">Route</label>
      <select id="routeSelect"></select>
    </div>
    <div class="control-group">
      <label id="lblDir">Direction</label>
      <select id="dirSelect"></select>
    </div>
    <div class="control-group">
      <label id="lblDay">Schedule Type</label>
      <select id="daySelect"></select>
    </div>
    <div class="control-group">
      <label id="lblStop">Boarding Stop</label>
      <select id="stopSelect"></select>
    </div>
  </div>

  <!-- Schedule List -->
  <div id="scheduleContainer">
    <div class="notice">Loading timetables...</div>
  </div>
</div>

      'KAGURA': { en: 'Kagura Express', jp: 'かぐら急行バス', zh_tr: '神樂急行巴士', zh_si: '神乐急行巴士', ko: '카구라 급행버스' },
      'NAEBA': { en: 'Naeba Express', jp: '苗場急行バス', zh_tr: '苗場急行巴士', zh_si: '苗场急行巴士', ko: '나에바 급행버스' },
      'YUZAWA_NAKASATO': { en: 'Yuzawa Nakazato Shuttle', jp: '湯沢中里シャトル', zh_tr: '湯澤中里接駁車', zh_si: '汤泽中里接驳车', ko: '유자와 나카자토 셔틀' },
      'NAKASATO': { en: 'Yuzawa Nakazato Shuttle', jp: '湯沢中里シャトル', zh_tr: '湯澤中里接駁車', zh_si: '汤泽中里接驳车', ko: '유자와 나카자토 셔틀' },
      'YUZAWA_PARK': { en: 'Yuzawa Park Shuttle', jp: '湯沢パークシャトル', zh_tr: '湯澤公園接駁車', zh_si: '汤泽公园接驳车', ko: '유자와 파크 셔틀' },
      'PARK': { en: 'Yuzawa Park Shuttle', jp: '湯沢パークシャトル', zh_tr: '湯澤公園接駁車', zh_si: '汤泽公园接驳车', ko: '유자와 파크 셔틀' },
      'ISHIUCHI_MARUYAMA': { en: 'Ishiuchi Maruyama Shuttle', jp: '石打丸山シャトル', zh_tr: '石打丸山接駁車', zh_si: '石打丸山接驳车', ko: '이시우치 마루야마 셔틀' },
      'ISHIUCHI': { en: 'Ishiuchi Maruyama Shuttle', jp: '石打丸山シャトル', zh_tr: '石打丸山接駁車', zh_si: '石打丸山接驳车', ko: '이시우치 마루야마 셔틀' },
      'GALA': { en: 'GALA Shuttle', jp: 'GALAシャトル', zh_tr: 'GALA接駁車', zh_si: 'GALA接驳车', ko: 'GALA 셔틀' },
      'NASPA': { en: 'NASPA Shuttle', jp: 'NASPAシャトル', zh_tr: 'NASPA接駁車', zh_si: 'NASPA接驳车', ko: 'NASPA 셔틀' },
      'YUZAWA_KOGEN': { en: 'Yuzawa Kogen Shuttle', jp: '湯沢高原シャトル', zh_tr: '湯澤高原接駁車', zh_si: '汤泽高原接驳车', ko: '유자와 코겐 셔틀' }
    },
    directions: {
      'OUTBOUND': { en: 'Outbound (From Station)', jp: '下り（越後湯沢駅発）', zh_tr: '去程（越後湯澤站發車）', zh_si: '去程（越后汤泽站发车）', ko: '하행 (유자와역발)' },
      'INBOUND': { en: 'Inbound (To Station)', jp: '上り（越後湯沢駅行）', zh_tr: '回程（往越後湯澤站）', zh_si: '回程（往越后汤泽站）', ko: '상행 (유자와역행)' },
      'TO_CRYSTAL': { en: 'To Seibu Crystal', jp: '西武クリスタル前行', zh_tr: '往西武水晶前', zh_si: '往西武水晶前', ko: '세이부 크리스탈행' },
      'TO_STATION': { en: 'To Echigo-Yuzawa Station', jp: '越後湯沢駅行', zh_tr: '往越後湯澤站', zh_si: '往越后汤泽站', ko: '에치고유자와역행' }
    }
  };

  let currentMode = 'winter';
  let cache = {
    winter: { stopsMap: {}, rawStops: [], schedules: [] },
    public: { stopsMap: {}, rawStops: [], schedules: [] }
  };
  let currentLang = 'en';

  const stopLangKeys = {
    en: 'Stop_Name_EN',
    jp: 'Stop_Name_JP',
    zh_tr: 'Stop_Name_ZH_TR',
    zh_si: 'Stop_Name_ZH_SI',
    ko: 'Stop_Name_KO'
  };

  function normalizeKey(str) {
    return (str || '')
      .trim()
      .toUpperCase()
      .replace(/[\s\-\/&・·,._~～—–\+]+/g, '_')
      .replace(/^_+|_+$/g, '');
  }

  function translateRoute(rawRoute) {
    const key = normalizeKey(rawRoute);
    const entry = I18N.routes[key] || I18N.routes[rawRoute];
    return (entry && entry[currentLang]) ? entry[currentLang] : rawRoute.replace(/_/g, ' ');
  }

  function translateDirection(rawDir) {
    const key = normalizeKey(rawDir);
    const entry = I18N.directions[key] || I18N.directions[rawDir];
    return (entry && entry[currentLang]) ? entry[currentLang] : rawDir.replace(/_/g, ' ');
  }

  function translateDays(rawDays) {
    const key = normalizeKey(rawDays);
    const entry = I18N.days[key] || I18N.days[rawDays];
    return (entry && entry[currentLang]) ? entry[currentLang] : rawDays.replace(/_/g, ' ');
  }

  function updateStaticUI() {
    document.getElementById('appTitle').textContent = I18N.ui.title[currentLang] || I18N.ui.title.en;
    document.getElementById('btnWinter').textContent = I18N.ui.winterBtn[currentLang] || I18N.ui.winterBtn.en;
    document.getElementById('btnPublic').textContent = I18N.ui.publicBtn[currentLang] || I18N.ui.publicBtn.en;
    document.getElementById('lblRoute').textContent = I18N.ui.routeLabel[currentLang] || I18N.ui.routeLabel.en;
    document.getElementById('lblDir').textContent = I18N.ui.dirLabel[currentLang] || I18N.ui.dirLabel.en;
    document.getElementById('lblDay').textContent = I18N.ui.dayLabel[currentLang] || I18N.ui.dayLabel.en;
    document.getElementById('lblStop').textContent = I18N.ui.stopLabel[currentLang] || I18N.ui.stopLabel.en;
    document.getElementById('searchInput').placeholder = I18N.ui.searchPlaceholder[currentLang] || I18N.ui.searchPlaceholder.en;
  }

  // Resilient stop finder across composite and raw keys
  function resolveStop(mode, routeCode, stopId) {
    const map = cache[mode].stopsMap;
    const rKey = normalizeKey(routeCode);
    const sId = (stopId || '').trim();

    return map[`${rKey}__${sId}`] ||
           map[sId] ||
           map[sId.replace(/^S-/, 'SC-')] ||
           map[sId.replace(/^SC-/, 'S-')] ||
           {};
  }

  // Bulletproof fare extractor
  function extractFare(stop) {
    if (!stop) return null;
    for (const key of Object.keys(stop)) {
      if (/^(fare|fare_yuzawa|price|cost|運賃)/i.test(key.trim())) {
        const val = stop[key];
        if (val !== undefined && val !== null && String(val).trim() !== '') {
          return String(val).trim();
        }
      }
    }
    return null;
  }

  function formatFareBadge(fareVal) {
    const freeText = I18N.ui.free[currentLang] || I18N.ui.free.en;
    if (!fareVal) return `<span class="fare-tag">${freeText}</span>`;
    
    const digits = String(fareVal).replace(/[^\d.]/g, '');
    const num = parseFloat(digits);
    if (!isNaN(num) && num > 0) {
      return `<span class="fare-tag paid">¥${Math.round(num).toLocaleString()}</span>`;
    }
    return `<span class="fare-tag">${freeText}</span>`;
  }

  async function loadDataForMode(mode) {
    if (cache[mode].schedules.length > 0) return;

    const stopsFile = DATA_CONFIG[mode].stops;
    const schedFile = DATA_CONFIG[mode].schedules;

    const [stopsRes, schedRes] = await Promise.all([
      fetch(stopsFile).then(r => {
        if (!r.ok) throw new Error(`HTTP ${r.status}: Failed to load ${stopsFile}`);
        return r.text();
      }),
      fetch(schedFile).then(r => {
        if (!r.ok) throw new Error(`HTTP ${r.status}: Failed to load ${schedFile}`);
        return r.text();
      })
    ]);

    // Parse Stops with BOM removal and whitespace trimming
    Papa.parse(stopsRes, {
      header: true,
      skipEmptyLines: 'greedy',
      transformHeader: h => h.trim().replace(/^\ufeff/, ''),
      complete: (results) => {
        cache[mode].rawStops = results.data;
        results.data.forEach(row => {
          const sId = (row.Stop_ID || row.stop_id || '').trim();
          const rCode = normalizeKey(row.Route_Code || row.Route_ID || '');
          if (sId) {
            cache[mode].stopsMap[sId] = row;
            if (rCode) {
              cache[mode].stopsMap[`${rCode}__${sId}`] = row;
            }
          }
        });
      }
    });

    // Parse Schedules
    Papa.parse(schedRes, {
      header: true,
      skipEmptyLines: 'greedy',
      transformHeader: h => h.trim().replace(/^\ufeff/, ''),
      complete: (results) => {
        cache[mode].schedules = results.data
          .filter(r => (r.Route_Code || r.Route_ID) && r.Departure_Time)
          .map(r => ({
            scheduleId: (r.Schedule_ID || '').trim(),
            routeCode: (r.Route_Code || r.Route_ID || '').trim(),
            stopId: (r.Stop_ID || '').trim(),
            tripNumber: (r.Trip_Number || '').trim(),
            direction: (r.Direction || '').trim(),
            operatingDays: (r.Operating_Days || 'Daily').trim(),
            departureTime: (r.Departure_Time || '').trim()
          }));
      }
    });
  }

  async function switchMode(mode) {
    currentMode = mode;
    document.getElementById('btnWinter').classList.toggle('active', mode === 'winter');
    document.getElementById('btnPublic').classList.toggle('active', mode === 'public');
    
    document.getElementById('scheduleContainer').innerHTML =
      `<div class="notice">${I18N.ui.loading[currentLang] || I18N.ui.loading.en}</div>`;

    try {
      await loadDataForMode(mode);
      populateRoutes();
    } catch (err) {
      document.getElementById('scheduleContainer').innerHTML =
        `<div class="notice" style="color: #f87171;">Error: ${err.message}</div>`;
    }
  }

  function populateRoutes() {
    const activeSchedules = cache[currentMode].schedules;
    const routeSelect = document.getElementById('routeSelect');
    const prevSelected = routeSelect.value;
    const uniqueRoutes = [...new Set(activeSchedules.map(s => s.routeCode))];

    routeSelect.innerHTML = '';
    uniqueRoutes.forEach(route => {
      const opt = document.createElement('option');
      opt.value = route;
      opt.textContent = translateRoute(route);
      routeSelect.appendChild(opt);
    });

    if (uniqueRoutes.includes(prevSelected)) {
      routeSelect.value = prevSelected;
    }

    routeSelect.onchange = populateDirections;
    populateDirections();
  }

  function populateDirections() {
    const route = document.getElementById('routeSelect').value;
    const dirSelect = document.getElementById('dirSelect');
    const prevSelected = dirSelect.value;
    const activeSchedules = cache[currentMode].schedules;
    const availableDirs = [...new Set(activeSchedules.filter(s => s.routeCode === route).map(s => s.direction))];

    dirSelect.innerHTML = '';
    availableDirs.forEach(dir => {
      const opt = document.createElement('option');
      opt.value = dir;
      opt.textContent = translateDirection(dir);
      dirSelect.appendChild(opt);
    });

    if (availableDirs.includes(prevSelected)) {
      dirSelect.value = prevSelected;
    }

    dirSelect.onchange = populateDaysAndStops;
    populateDaysAndStops();
  }

  function populateDaysAndStops() {
    const route = document.getElementById('routeSelect').value;
    const dir = document.getElementById('dirSelect').value;
    const daySelect = document.getElementById('daySelect');
    const stopSelect = document.getElementById('stopSelect');
    const activeSchedules = cache[currentMode].schedules;

    const routeSchedules = activeSchedules.filter(s => s.routeCode === route && s.direction === dir);

    // Days Filter
    const prevDay = daySelect.value;
    const availableDays = [...new Set(routeSchedules.map(s => s.operatingDays))];
    daySelect.innerHTML = `<option value="ALL">${I18N.ui.allDays[currentLang] || I18N.ui.allDays.en}</option>`;
    availableDays.forEach(day => {
      const opt = document.createElement('option');
      opt.value = day;
      opt.textContent = translateDays(day);
      daySelect.appendChild(opt);
    });
    if (prevDay && (availableDays.includes(prevDay) || prevDay === 'ALL')) {
      daySelect.value = prevDay;
    }

    // Stops Filter
    const prevStop = stopSelect.value;
    const routeStopIds = [...new Set(routeSchedules.map(s => s.stopId))];
    stopSelect.innerHTML = `<option value="ALL">${I18N.ui.allStops[currentLang] || I18N.ui.allStops.en}</option>`;
    routeStopIds.forEach(sId => {
      const stop = resolveStop(currentMode, route, sId);
      const colKey = stopLangKeys[currentLang] || 'Stop_Name_EN';
      const stopName = stop[colKey] || stop['Stop_Name_EN'] || sId;
      const opt = document.createElement('option');
      opt.value = sId;
      opt.textContent = stopName;
      stopSelect.appendChild(opt);
    });
    if (prevStop && (routeStopIds.includes(prevStop) || prevStop === 'ALL')) {
      stopSelect.value = prevStop;
    }

    daySelect.onchange = renderTimetable;
    stopSelect.onchange = renderTimetable;
    renderTimetable();
  }

  function renderTimetable() {
    const route = document.getElementById('routeSelect').value;
    const dir = document.getElementById('dirSelect').value;
    const selectedDay = document.getElementById('daySelect').value;
    const selectedStop = document.getElementById('stopSelect').value;
    const container = document.getElementById('scheduleContainer');
    const activeSchedules = cache[currentMode].schedules;

    let filtered = activeSchedules.filter(s => s.routeCode === route && s.direction === dir);

    if (selectedDay && selectedDay !== 'ALL') {
      filtered = filtered.filter(s => s.operatingDays === selectedDay);
    }
    if (selectedStop && selectedStop !== 'ALL') {
      filtered = filtered.filter(s => s.stopId === selectedStop);
    }

    filtered.sort((a, b) => {
      const [aH, aM] = a.departureTime.split(':').map(Number);
      const [bH, bM] = b.departureTime.split(':').map(Number);
      return (aH * 60 + aM) - (bH * 60 + bM);
    });

    if (filtered.length === 0) {
      container.innerHTML = `<div class="notice">${I18N.ui.noDepartures[currentLang] || I18N.ui.noDepartures.en}</div>`;
      return;
    }

    const tripWord = I18N.ui.trip[currentLang] || I18N.ui.trip.en;
    const mapWord = I18N.ui.map[currentLang] || I18N.ui.map.en;

    container.innerHTML = filtered.map(item => {
      const stop = resolveStop(currentMode, item.routeCode, item.stopId);
      const colKey = stopLangKeys[currentLang] || 'Stop_Name_EN';
      const stopName = stop[colKey] || stop['Stop_Name_EN'] || item.stopId;
      const fareBadge = formatFareBadge(extractFare(stop));
      const mapUrl = stop.Google_Maps_URL;
      const mapLink = mapUrl ? `<a class="map-link" href="${mapUrl}" target="_blank" rel="noopener">${mapWord}</a>` : '';
      const daysText = translateDays(item.operatingDays);

      return `
        <div class="card">
          <div class="time-col">
            <span class="time">${item.departureTime}</span>
            <span class="trip-badge">${tripWord} #${item.tripNumber} · ${daysText}</span>
          </div>
          <div class="info-col">
            <div class="stop-name">${stopName}</div>
            <div class="details">${fareBadge} ${mapLink}</div>
          </div>
        </div>
      `;
    }).join('');
  }

  // Preload both modes in background for seamless universal search
  async function preloadAll() {
    await Promise.all([loadDataForMode('winter'), loadDataForMode('public')]);
  }

  // Multi-Language Universal Search Engine
  const searchInput = document.getElementById('searchInput');
  const searchDropdown = document.getElementById('searchDropdown');
  const clearSearchBtn = document.getElementById('clearSearch');

  searchInput.addEventListener('input', async () => {
    const q = searchInput.value.trim().toLowerCase();
    if (!q) {
      searchDropdown.style.display = 'none';
      clearSearchBtn.style.display = 'none';
      return;
    }
    clearSearchBtn.style.display = 'block';

    await preloadAll();

    const matches = [];
    const seen = new Set();

    ['winter', 'public'].forEach(mode => {
      const rawStops = cache[mode].rawStops;
      const schedules = cache[mode].schedules;

      // Search Stops across all 5 languages
      rawStops.forEach(stop => {
        const names = [
          stop.Stop_Name_EN, stop.Stop_Name_JP,
          stop.Stop_Name_ZH_TR, stop.Stop_Name_ZH_SI, stop.Stop_Name_KO
        ].filter(Boolean);

        const isMatch = names.some(n => n.toLowerCase().includes(q));
        if (isMatch) {
          const sId = (stop.Stop_ID || '').trim();
          const rCode = (stop.Route_Code || stop.Route_ID || '').trim();
          const dedupKey = `${mode}_stop_${sId}_${rCode}`;
          if (!seen.has(dedupKey)) {
            seen.add(dedupKey);
            const colKey = stopLangKeys[currentLang] || 'Stop_Name_EN';
            matches.push({
              type: 'stop',
              mode,
              routeCode: rCode,
              stopId: sId,
              title: stop[colKey] || stop.Stop_Name_EN || sId,
              subtitle: `${mode === 'winter' ? '❄️ Winter' : '🚍 Public'} · ${translateRoute(rCode)}`
            });
          }
        }
      });

      // Search Routes across all 5 languages
      const uniqueRoutes = [...new Set(schedules.map(s => s.routeCode))];
      uniqueRoutes.forEach(rCode => {
        const translatedNames = ['en', 'jp', 'zh_tr', 'zh_si', 'ko'].map(l => {
          const entry = I18N.routes[normalizeKey(rCode)];
          return entry && entry[l] ? entry[l] : rCode;
        });
        const isMatch = translatedNames.some(n => n.toLowerCase().includes(q)) || rCode.toLowerCase().includes(q);
        if (isMatch) {
          const dedupKey = `${mode}_route_${rCode}`;
          if (!seen.has(dedupKey)) {
            seen.add(dedupKey);
            matches.push({
              type: 'route',
              mode,
              routeCode: rCode,
              stopId: 'ALL',
              title: translateRoute(rCode),
              subtitle: mode === 'winter' ? '❄️ Winter Shuttles' : '🚍 Public Transit'
            });
          }
        }
      });
    });

    if (matches.length === 0) {
      searchDropdown.innerHTML = `<div class="search-item" style="color: var(--text-muted); cursor: default;">No results found</div>`;
      searchDropdown.style.display = 'block';
      return;
    }

    searchDropdown.innerHTML = matches.slice(0, 10).map(m => `
      <div class="search-item" onclick="selectSearchMatch('${m.mode}', '${m.routeCode}', '${m.stopId}')">
        <div>
          <div class="search-item-main">${m.title}</div>
          <div class="search-item-sub">${m.subtitle}</div>
        </div>
        <span class="search-badge">${m.type.toUpperCase()}</span>
      </div>
    `).join('');
    searchDropdown.style.display = 'block';
  });

  window.selectSearchMatch = async function(mode, routeCode, stopId) {
    searchDropdown.style.display = 'none';
    searchInput.value = '';
    clearSearchBtn.style.display = 'none';

    if (currentMode !== mode) {
      await switchMode(mode);
    }

    if (routeCode) {
      document.getElementById('routeSelect').value = routeCode;
      populateDirections();
    }
    if (stopId && stopId !== 'ALL') {
      document.getElementById('stopSelect').value = stopId;
      renderTimetable();
    }
  };

  clearSearchBtn.addEventListener('click', () => {
    searchInput.value = '';
    searchDropdown.style.display = 'none';
    clearSearchBtn.style.display = 'none';
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-wrapper')) {
      searchDropdown.style.display = 'none';
    }
  });

  document.getElementById('langSelect').addEventListener('change', (e) => {
    currentLang = e.target.value;
    updateStaticUI();
    populateRoutes();
  });

  // Startup
  updateStaticUI();
  switchMode('winter');
  preloadAll();
</script>
