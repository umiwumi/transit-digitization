<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yuzawa Transit Directory</title>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      line-height: 1.5;
    }
    .container { max-width: 680px; margin: 0 auto; }
    header { margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.25rem; font-weight: 700; color: var(--accent); }
    select, button {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }
    select:focus { border-color: var(--accent); }
    
    .mode-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: var(--card-bg);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .mode-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      transition: background 0.2s, color 0.2s;
    }
    .mode-btn.active {
      background: var(--accent);
      color: #0f172a;
    }

    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    .control-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .time-col { display: flex; flex-direction: column; align-items: flex-start; }
    .time { font-size: 1.4rem; font-weight: 700; color: var(--accent); }
    .trip-badge { font-size: 0.75rem; color: var(--text-muted); }
    .info-col { display: flex; flex-direction: column; align-items: flex-end; text-align: right; }
    .stop-name { font-weight: 600; font-size: 1rem; }
    .details { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }
    .map-link { color: var(--accent); text-decoration: none; font-size: 0.8rem; margin-left: 8px; }
    .map-link:hover { text-decoration: underline; }
    .notice { text-align: center; color: var(--text-muted); padding: 24px; font-size: 0.95rem; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1 id="appTitle">🚌 Yuzawa Transit</h1>
    <select id="langSelect">
      <option value="en">English</option>
      <option value="jp">日本語</option>
      <option value="zh_tr">繁體中文</option>
      <option value="zh_si">简体中文</option>
      <option value="ko">한국어</option>
    </select>
  </header>

  <div class="mode-toggle">
    <button class="mode-btn active" id="btnWinter" onclick="switchMode('winter')">❄️ Winter Shuttles</button>
    <button class="mode-btn" id="btnPublic" onclick="switchMode('public')">🚍 Public Transit</button>
  </div>

  <div class="controls">
    <div class="control-group">
      <label id="lblRoute">Route</label>
      <select id="routeSelect"></select>
    </div>
    <div class="control-group">
      <label id="lblDir">Direction</label>
      <select id="dirSelect"></select>
    </div>
  </div>

  <div id="scheduleContainer">
    <div class="notice" id="initialNotice">Loading timetables...</div>
  </div>
</div>

<script>
  const DATA_CONFIG = {
    winter: {
      stops: 'Winter_Shuttle_Stops.csv',
      schedules: 'Winter_Shuttle_Schedules.csv'
    },
    public: {
      stops: 'Public_Transit_Stops.csv',
      schedules: 'Public_Transit_Schedule.csv'
    }
  };

  const I18N = {
    ui: {
      title: { en: '🚌 Yuzawa Transit', jp: '🚌 湯沢町 交通案内', zh_tr: '🚌 湯澤交通指南', zh_si: '🚌 汤泽交通指南', ko: '🚌 유자와 교통 가이드' },
      winterBtn: { en: '❄️ Winter Shuttles', jp: '❄️ 冬季シャトルバス', zh_tr: '❄️ 冬季接駁車', zh_si: '❄️ 冬季接驳车', ko: '❄️ 겨울 셔틀버스' },
      publicBtn: { en: '🚍 Public Transit', jp: '🚍 路線バス', zh_tr: '🚍 路線公車', zh_si: '🚍 路线公交', ko: '🚍 일반 노선버스' },
      routeLabel: { en: 'Route', jp: '路線', zh_tr: '路線', zh_si: '路线', ko: '노선' },
      dirLabel: { en: 'Direction', jp: '方面 / 行き先', zh_tr: '方向', zh_si: '方向', ko: '방향' },
      free: { en: 'Free', jp: '無料', zh_tr: '免費', zh_si: '免费', ko: '무료' },
      trip: { en: 'Trip', jp: '便', zh_tr: '班次', zh_si: '班次', ko: '운행편' },
      map: { en: 'Map ↗', jp: '地図 ↗', zh_tr: '地圖 ↗', zh_si: '地图 ↗', ko: '지도 ↗' },
      loading: { en: 'Loading timetables...', jp: '時刻表を読み込み中...', zh_tr: '正在載入時刻表...', zh_si: '正在加载时刻表...', ko: '시간표를 불러오는 중...' },
      noDepartures: { en: 'No departures found for this selection.', jp: '該当する運行便がありません。', zh_tr: '沒有找到符合條件的班次。', zh_si: '没有找到符合条件的班次。', ko: '해당 조건의 운행 정보가 없습니다.' }
    },
    days: {
      'Daily': { en: 'Daily', jp: '毎日運行', zh_tr: '每日運行', zh_si: '每日运行', ko: '매일 운행' },
      'Weekday': { en: 'Weekday', jp: '平日', zh_tr: '平日', zh_si: '平日', ko: '평일' },
      'Weekend/Holiday': { en: 'Weekend / Holiday', jp: '土休日', zh_tr: '週末 / 假日', zh_si: '周末 / 节假日', ko: '주말 / 공휴일' },
      'Weekend_Holiday': { en: 'Weekend / Holiday', jp: '土休日', zh_tr: '週末 / 假日', zh_si: '周末 / 节假日', ko: '주말 / 공휴일' },
      'Designated Fridays Only': { en: 'Designated Fridays Only', jp: '特定金曜日運行', zh_tr: '特定週五運行', zh_si: '特定周五运行', ko: '특정 금요일 운행' }
    },
    routes: {
      'SEIBU_CRYSTAL': { en: 'Seibu Crystal Line', jp: '西武クリスタル線', zh_tr: '西武水晶線', zh_si: '西武水晶线', ko: '세이부 크리스탈선' },
      'R-01': { en: 'Seibu Crystal Line', jp: '西武クリスタル線', zh_tr: '西武水晶線', zh_si: '西武水晶线', ko: '세이부 크리스탈선' },
      'BLUE': { en: 'Blue Line (GALA / NASPA)', jp: 'ブルーライン（GALA・NASPA）', zh_tr: '藍線（GALA・NASPA）', zh_si: '蓝线（GALA・NASPA）', ko: '블루 라인 (GALA・NASPA)' },
      'ORANGE': { en: 'Orange Line', jp: 'オレンジライン', zh_tr: '橘線', zh_si: '橙线', ko: '오렌지 라인' },
      'PURPLE': { en: 'Purple Line', jp: 'パープルライン', zh_tr: '紫線', zh_si: '紫线', ko: '퍼플 라인' },
      'GREEN': { en: 'Green Line', jp: 'グリーンライン', zh_tr: '綠線', zh_si: '绿线', ko: '그린 라인' },
      'PINK': { en: 'Pink Line', jp: 'ピンクライン', zh_tr: '粉紅線', zh_si: '粉红线', ko: '핑크 라인' },
      'YELLOW': { en: 'Yellow Line', jp: 'イエローライン', zh_tr: '黃線', zh_si: '黄线', ko: '옐로우 라인' },
      'MAIKO_DIRECT': { en: 'Maiko Direct Express', jp: '舞子直行便', zh_tr: '舞子直達專車', zh_si: '舞子直达专车', ko: '마이코 직행' },
      'MAIKO DIRECT': { en: 'Maiko Direct Express', jp: '舞子直行便', zh_tr: '舞子直達專車', zh_si: '舞子直达专车', ko: '마이코 직행' },
      'IWAHARA': { en: 'Iwahara Line', jp: '岩原線', zh_tr: '岩原線', zh_si: '岩原线', ko: '이와하라선' },
      'KAGURA_NAEBA': { en: 'Kagura / Naeba Express', jp: 'かぐら・苗場急行バス', zh_tr: '神樂・苗場急行巴士', zh_si: '神乐・苗场急行巴士', ko: '카구라・나에바 급행버스' },
      'KIYOTSUKYO': { en: 'Kiyotsukyo Gorge Line', jp: '清津峡線', zh_tr: '清津峽線', zh_si: '清津峡线', ko: '키요츠쿄선' },
      'TOWN_LOOP': { en: 'Town Loop Line', jp: '町内循環線', zh_tr: '市區循環線', zh_si: '市区循环线', ko: '마을 순환선' },
      'MUIKAMACHI': { en: 'Muikamachi Line', jp: '六日町線', zh_tr: '六日町線', zh_si: '六日町线', ko: '무이카마치선' },
      'DAIGENTA': { en: 'Daigenta Canyon Line', jp: '大源太線', zh_tr: '大源太峽谷線', zh_si: '大源太峡谷线', ko: '다이겐타선' }
    },
    directions: {
      'Outbound': { en: 'Outbound (From Station)', jp: '下り（越後湯沢駅発）', zh_tr: '去程（越後湯澤站發車）', zh_si: '去程（越后汤泽站发车）', ko: '하행 (유자와역발)' },
      'Inbound': { en: 'Inbound (To Station)', jp: '上り（越後湯沢駅行）', zh_tr: '回程（往越後湯澤站）', zh_si: '回程（往越后汤泽站）', ko: '상행 (유자와역행)' },
      'To_Crystal': { en: 'To Seibu Crystal', jp: '西武クリスタル前行', zh_tr: '往西武水晶前', zh_si: '往西武水晶前', ko: '세이부 크리스탈행' },
      'To_Station': { en: 'To Echigo-Yuzawa Station', jp: '越後湯沢駅行', zh_tr: '往越後湯澤站', zh_si: '往越后汤泽站', ko: '에치고유자와역행' }
    }
  };

  let currentMode = 'winter';
  let cache = {
    winter: { stopsMap: {}, schedules: [] },
    public: { stopsMap: {}, schedules: [] }
  };
  let currentLang = 'en';

  const stopLangKeys = {
    en: 'Stop_Name_EN',
    jp: 'Stop_Name_JP',
    zh_tr: 'Stop_Name_ZH_TR',
    zh_si: 'Stop_Name_ZH_SI',
    ko: 'Stop_Name_KO'
  };

  function translateRoute(rawRoute) {
    const entry = I18N.routes[rawRoute];
    return (entry && entry[currentLang]) ? entry[currentLang] : rawRoute.replace(/_/g, ' ');
  }

  function translateDirection(rawDir) {
    const entry = I18N.directions[rawDir];
    return (entry && entry[currentLang]) ? entry[currentLang] : rawDir.replace(/_/g, ' ');
  }

  function translateDays(rawDays) {
    const entry = I18N.days[rawDays];
    return (entry && entry[currentLang]) ? entry[currentLang] : rawDays.replace(/_/g, ' ');
  }

  function updateStaticUI() {
    document.getElementById('appTitle').textContent = I18N.ui.title[currentLang] || I18N.ui.title.en;
    document.getElementById('btnWinter').textContent = I18N.ui.winterBtn[currentLang] || I18N.ui.winterBtn.en;
    document.getElementById('btnPublic').textContent = I18N.ui.publicBtn[currentLang] || I18N.ui.publicBtn.en;
    document.getElementById('lblRoute').textContent = I18N.ui.routeLabel[currentLang] || I18N.ui.routeLabel.en;
    document.getElementById('lblDir').textContent = I18N.ui.dirLabel[currentLang] || I18N.ui.dirLabel.en;
  }

  async function loadDataForMode(mode) {
    if (cache[mode].schedules.length > 0) return;

    const stopsFile = DATA_CONFIG[mode].stops;
    const schedFile = DATA_CONFIG[mode].schedules;

    const [stopsRes, schedRes] = await Promise.all([
      fetch(stopsFile).then(r => {
        if (!r.ok) throw new Error(`HTTP ${r.status}: Failed to load ${stopsFile}`);
        return r.text();
      }),
      fetch(schedFile).then(r => {
        if (!r.ok) throw new Error(`HTTP ${r.status}: Failed to load ${schedFile}`);
        return r.text();
      })
    ]);

    Papa.parse(stopsRes, {
      header: true,
      skipEmptyLines: true,
      complete: (results) => {
        results.data.forEach(row => {
          if (row.Stop_ID) {
            cache[mode].stopsMap[row.Stop_ID.trim()] = row;
          }
        });
      }
    });

    Papa.parse(schedRes, {
      header: true,
      skipEmptyLines: true,
      complete: (results) => {
        cache[mode].schedules = results.data
          .filter(r => (r.Route_Code || r.Route_ID) && r.Departure_Time)
          .map(r => ({
            scheduleId: (r.Schedule_ID || '').trim(),
            routeCode: (r.Route_Code || r.Route_ID || '').trim(),
            stopId: (r.Stop_ID || '').trim(),
            tripNumber: (r.Trip_Number || '').trim(),
            direction: (r.Direction || '').trim(),
            operatingDays: (r.Operating_Days || 'Daily').trim(),
            departureTime: (r.Departure_Time || '').trim()
          }));
      }
    });
  }

  async function switchMode(mode) {
    currentMode = mode;
    document.getElementById('btnWinter').classList.toggle('active', mode === 'winter');
    document.getElementById('btnPublic').classList.toggle('active', mode === 'public');
    
    document.getElementById('scheduleContainer').innerHTML =
      `<div class="notice">${I18N.ui.loading[currentLang] || I18N.ui.loading.en}</div>`;

    try {
      await loadDataForMode(mode);
      populateRoutes();
    } catch (err) {
      document.getElementById('scheduleContainer').innerHTML =
        `<div class="notice" style="color: #f87171;">Error: ${err.message}</div>`;
    }
  }

  function populateRoutes() {
    const activeSchedules = cache[currentMode].schedules;
    const routeSelect = document.getElementById('routeSelect');
    const prevSelected = routeSelect.value;
    const uniqueRoutes = [...new Set(activeSchedules.map(s => s.routeCode))];

    routeSelect.innerHTML = '';
    uniqueRoutes.forEach(route => {
      const opt = document.createElement('option');
      opt.value = route;
      opt.textContent = translateRoute(route);
      routeSelect.appendChild(opt);
    });

    if (uniqueRoutes.includes(prevSelected)) {
      routeSelect.value = prevSelected;
    }

    routeSelect.onchange = populateDirections;
    populateDirections();
  }

  function populateDirections() {
    const route = document.getElementById('routeSelect').value;
    const dirSelect = document.getElementById('dirSelect');
    const prevSelected = dirSelect.value;
    const activeSchedules = cache[currentMode].schedules;
    const availableDirs = [...new Set(activeSchedules.filter(s => s.routeCode === route).map(s => s.direction))];

    dirSelect.innerHTML = '';
    availableDirs.forEach(dir => {
      const opt = document.createElement('option');
      opt.value = dir;
      opt.textContent = translateDirection(dir);
      dirSelect.appendChild(opt);
    });

    if (availableDirs.includes(prevSelected)) {
      dirSelect.value = prevSelected;
    }

    dirSelect.onchange = renderTimetable;
    renderTimetable();
  }

  function renderTimetable() {
    const route = document.getElementById('routeSelect').value;
    const dir = document.getElementById('dirSelect').value;
    const container = document.getElementById('scheduleContainer');
    const activeStops = cache[currentMode].stopsMap;
    const activeSchedules = cache[currentMode].schedules;

    const filtered = activeSchedules
      .filter(s => s.routeCode === route && s.direction === dir)
      .sort((a, b) => {
        const [aH, aM] = a.departureTime.split(':').map(Number);
        const [bH, bM] = b.departureTime.split(':').map(Number);
        return (aH * 60 + aM) - (bH * 60 + bM);
      });

    if (filtered.length === 0) {
      container.innerHTML = `<div class="notice">${I18N.ui.noDepartures[currentLang] || I18N.ui.noDepartures.en}</div>`;
      return;
    }

    const freeText = I18N.ui.free[currentLang] || I18N.ui.free.en;
    const tripWord = I18N.ui.trip[currentLang] || I18N.ui.trip.en;
    const mapWord = I18N.ui.map[currentLang] || I18N.ui.map.en;

    container.innerHTML = filtered.map(item => {
      const stop = activeStops[item.stopId] || {};
      const colKey = stopLangKeys[currentLang] || 'Stop_Name_EN';
      const stopName = stop[colKey] || stop['Stop_Name_EN'] || item.stopId;
      const fareVal = stop.Fare || stop.Fare_Yuzawa;
      const fareText = fareVal && parseInt(fareVal) > 0 ? `¥${fareVal}` : freeText;
      const mapUrl = stop.Google_Maps_URL;
      const mapLink = mapUrl ? `<a class="map-link" href="${mapUrl}" target="_blank" rel="noopener">${mapWord}</a>` : '';
      const daysText = translateDays(item.operatingDays);

      return `
        <div class="card">
          <div class="time-col">
            <span class="time">${item.departureTime}</span>
            <span class="trip-badge">${tripWord} #${item.tripNumber} · ${daysText}</span>
          </div>
          <div class="info-col">
            <div class="stop-name">${stopName}</div>
            <div class="details">${fareText} ${mapLink}</div>
          </div>
        </div>
      `;
    }).join('');
  }

  document.getElementById('langSelect').addEventListener('change', (e) => {
    currentLang = e.target.value;
    updateStaticUI();
    populateRoutes();
  });

  updateStaticUI();
  switchMode('winter');
</script>

</body>
</html>
